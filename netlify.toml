# Netlify configuration for Spot the Difference (static site, no framework).
# The build step copies only the game assets into `dist/`, deliberately
# leaving the *_HIT.png answer-key images out of the published site.
[build]
  publish = "dist"
  command = "mkdir -p dist/C01 dist/C02 && cp index.html styles.css game.js dist/ && cp C01/*_A.png C01/*_B.png dist/C01/ && cp C02/*_A.png C02/*_B.png dist/C02/"
